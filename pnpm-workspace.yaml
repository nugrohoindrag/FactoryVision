packages:
  - 'apps/*'
  - 'packages/*'

# esbuild ships a platform binary and needs its postinstall to run (Vite/Vitest).
# Prisma downloads its query engine in a postinstall and generates the client
# from it; without both, `apps/api` has no database layer at all.
# `@nestjs/core` only prints a donation notice — nothing is built, so it stays off.
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
